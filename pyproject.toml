[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]

name = "juggle-count"
version = "0.1.0"
description = "Automatic football juggle counter using computer vision and YOLOv8"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "imageio>=2.37.0",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=1.26.0,<2.0.0",
    "opencv-python>=4.10.0.84",
    "python-multipart>=0.0.20",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "ultralytics>=8.3.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
dev = "backend.main:dev"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.uv.sources]

torch = [
  { index = "pytorch-cu124" },
]
torchvision = [
  { index = "pytorch-cu124" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
[dependency-groups]
dev = [
    "ruff>=0.8.0",
]
